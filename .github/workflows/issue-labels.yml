name: Issue Labels

on:
  push:
    branches:
      - main
    paths:
      - .github/ISSUE_TEMPLATE/**
      - .github/workflows/issue-labels.yml
  workflow_dispatch:

permissions:
  issues: write

jobs:
  sync:
    name: Sync issue labels
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Ensure managed issue labels exist
        uses: actions/github-script@v8
        with:
          script: |
            const managedLabels = [
              {
                name: "bug",
                color: "d73a4a",
                description: "Something is broken or behaving incorrectly.",
              },
              {
                name: "enhancement",
                color: "a2eeef",
                description: "Requested improvement or new capability.",
              },
              {
                name: "needs-triage",
                color: "fbca04",
                description: "Issue needs maintainer review and initial categorization.",
              },
              {
                name: "documentation",
                color: "0075ca",
                description: "Documentation, examples, or release notes.",
              },
              {
                name: "ci",
                color: "5319e7",
                description: "Continuous integration, checks, or release automation.",
              },
              {
                name: "package",
                color: "c5def5",
                description: "Public package or NPM distribution work.",
              },
              {
                name: "desktop",
                color: "bfdadc",
                description: "Desktop app behavior, packaging, or updates.",
              },
              {
                name: "web",
                color: "d4c5f9",
                description: "Web app or marketing site behavior.",
              },
            ];

            for (const label of managedLabels) {
              try {
                const { data: existing } = await github.rest.issues.getLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label.name,
                });

                if (
                  existing.color !== label.color ||
                  (existing.description ?? "") !== label.description
                ) {
                  await github.rest.issues.updateLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    name: label.name,
                    color: label.color,
                    description: label.description,
                  });
                }
              } catch (error) {
                if (error.status !== 404) {
                  throw error;
                }

                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label.name,
                  color: label.color,
                  description: label.description,
                });
              }
            }
